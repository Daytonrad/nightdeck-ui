name: Feature request
description: Suggest a new item type, option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to build?
      description: Describe the use case first, then the idea.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: How could the API look?
      render: js
