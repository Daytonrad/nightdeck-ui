<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nightdeck-ui - basic example</title>
<link rel="stylesheet" href="../dist/nightdeck.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
    background: radial-gradient(900px 500px at 20% 0%, #1a2530, transparent 60%), radial-gradient(700px 500px at 100% 100%, #1d1a2a, transparent 60%), #0c0f12; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../dist/nightdeck.js"></script>
<script>
  // One panel with every kind of item. Edit the config to try things out.
  const panel = Nightdeck.create("#app", {
    title: "Control",
    version: "nightdeck-ui example",
    tabs: {
      display: [
        { type: "toggle", id: "vsync", label: "vertical sync", value: true },
        { type: "toggle", id: "hdr", label: "hdr output" },
        { type: "toggle", id: "fps", label: "show fps counter", value: true },
        { type: "toggle", id: "blur", label: "motion blur" },
        { type: "slider", id: "brightness", label: "brightness", value: 60 },
        { type: "slider", id: "fov", label: "field of view", value: 90, min: 60, max: 120, unit: "°" },
        { type: "select", id: "quality", label: "quality", options: ["low", "medium", "high", "ultra"], value: "high" }
      ],
      status: [
        { type: "meter", id: "cpu", label: "cpu", value: 32 },
        { type: "meter", id: "memory", label: "memory", value: 64, text: "10.2 / 16 GB" },
        { type: "meter", id: "disk", label: "disk", value: 100, text: "full" },
        { type: "info", id: "uptime", label: "running for", value: "0 s" },
        { type: "info", id: "host", label: "build", value: "0.1.0" }
      ],
      account: [
        { type: "text", id: "name", label: "display name", placeholder: "your name" },
        { type: "select", id: "lang", label: "language", options: [{ value: "en", label: "English" }, { value: "de", label: "Deutsch" }] },
        { type: "toggle", id: "news", label: "newsletter" },
        { type: "button", id: "save", label: "save", variant: "accent" },
        { type: "button", id: "logout", label: "sign out", variant: "danger" }
      ]
    },
    presets: {
      quality: { hdr: true, blur: true, quality: "ultra", brightness: 70 },
      performance: { hdr: false, blur: false, vsync: false, quality: "low" }
    },
    onChange(id, value, all) { /* save the settings, update your app, ... */ },
    onAction(id) { panel.log("button pressed: " + id); }
  });

  // live values for the status tab
  const start = Date.now();
  setInterval(() => {
    panel.set("cpu", 20 + Math.random() * 50);
    panel.set("uptime", Math.round((Date.now() - start) / 1000) + " s");
  }, 1000);
</script>
</body>
</html>
